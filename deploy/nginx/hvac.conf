# Serves the hvac_front_end build and passes API requests to gunicorn, so the
# browser sees one address for both and needs no cross-origin setup.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Where the frontend's dist/ folder is copied
    root /var/www/hvac;
    index index.html;

    location /api/ {
        # Must match bind in gunicorn.conf.py. The /api prefix is passed through unchanged.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
